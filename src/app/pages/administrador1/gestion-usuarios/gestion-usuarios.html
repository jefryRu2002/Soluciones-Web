<div class="usuarios-page">

    <!-- HEADER -->

    <div class="header">

        <div>

            <h1>
                👥 Gestión de Usuarios
            </h1>

            <p>
                Administración de clientes, técnicos y administradores
            </p>

        </div>

        <button class="btn-nuevo">

            + Nuevo Usuario

        </button>

    </div>

    <!-- BUSCADOR -->

    <div class="buscador-container">

        <input
            type="text"
            placeholder="Buscar usuario..."
            [(ngModel)]="buscador">

    </div>

    <!-- CARDS RESUMEN -->

    <div class="cards-resumen">

        <div class="card-mini">

            <h3>
                👥 Clientes
            </h3>

            <h1>
                125
            </h1>

        </div>

        <div class="card-mini">

            <h3>
                🛠️ Técnicos
            </h3>

            <h1>
                18
            </h1>

        </div>

        <div class="card-mini">

            <h3>
                🛡️ Administradores
            </h3>

            <h1>
                3
            </h1>

        </div>

    </div>

    <!-- TABLA -->

    <div class="tabla-container">

        <table>

            <thead>

                <tr>

                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Correo</th>
                    <th>Rol</th>
                    <th>Estado</th>
                    <th>Acciones</th>

                </tr>

            </thead>

            <tbody>

                <tr
                    *ngFor="let usuario of usuariosFiltrados">

                    <td>
                        {{ usuario.id }}
                    </td>

                    <td>
                        {{ usuario.nombre }}
                    </td>

                    <td>
                        {{ usuario.correo }}
                    </td>

                    <td>
                        {{ usuario.rol }}
                    </td>

                    <td>

                        <span
                            class="estado"
                            [ngClass]="{
                                'activo': usuario.estado === 'Activo',
                                'inactivo': usuario.estado === 'Inactivo'
                            }">

                            {{ usuario.estado }}

                        </span>

                    </td>

                    <td class="acciones">

                        <button
                            class="btn-editar"
                            (click)="editarUsuario(usuario)">

                            ✏️

                        </button>

                        <button
                            class="btn-estado"
                            (click)="cambiarEstado(usuario)">

                            🔄

                        </button>

                        <button
                            class="btn-eliminar"
                            (click)="eliminarUsuario(usuario.id)">

                            🗑️

                        </button>

                    </td>

                </tr>

            </tbody>

        </table>

    </div>

</div>
