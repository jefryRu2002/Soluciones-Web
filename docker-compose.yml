version: '3.8'

services:
  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: keycloak-server
    command: start-dev
    environment:
      KC_DB: mysql
      # Se conecta a tu MySQL local usando la dirección especial de Docker
      KC_DB_URL: jdbc:mysql://host.docker.internal:3306/keycloak_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      
      # Tus credenciales locales
      KC_DB_USERNAME: root
      KC_DB_PASSWORD: "123456"
      
      # Credenciales para entrar al panel de administración de Keycloak (puedes cambiarlas si deseas)
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"